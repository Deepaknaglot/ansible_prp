---
  - name: create multiple users using the loop
    hosts: all
    become: true
    gather_facts: false
    vars:
      myuser:
        - test1
        - test2
        - test3
        - test4
        - test5
    tasks:
      - name: create multiple users using the loop
        ansible.builtin.user:
          name: "{{ item }}"
          state: present
        loop: "{{ myuser }}"
