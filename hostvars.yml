---
- name: showing hosts variables
  hosts: all
  vars:
    myuser: lori
    groups: mygroup
  tasks:
    - debug:
        msg:  This hosts with the name {{ inventory_hostname }} is using {{ hostvars }}
    - name: creating group
      command: groupadd "{{ groups }}"
    - name: creating user that is member of {{ groups }}
      user:
        name: "{{ myuser }}"
        groups: "{{ groups }}
