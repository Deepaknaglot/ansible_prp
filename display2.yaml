---
- name: display specific facts
  hosts: all
  become: true
  tasks:
    - name: buddy let's see below facts for our purpose
      ansible.builtin.debug:
        msg: >-
          Host '{{ ansible_facts["fqdn"] }}' with python version
          '{{ ansible_facts["python_version"] }}' has processor count
          '{{ ansible_facts["processor_count"] }}' and '{{ ansible_facts["memtotal_mb"] }}' 
          MiB of total system memory
    - name: Display local variable
      ansible.builtin.debug:
        msg: >-
          The ansible_local variable is set to
           '{{ ansible_facts["ansible_local"] }}'