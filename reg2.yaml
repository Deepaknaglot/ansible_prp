---
- name: apache installation
  hosts: all
  become: true
  vars_prompt:
    - name: pkg1
      prompt: "Enter the pkg1 name if you want to change it other that the variable set"
      private: false
  tasks:
    - name: installa the 
      ansible.builtin.dnf:
        name: "{{ pkg1 }}"       
        state: latest
      when: ansible_distribution == "RedHat"
      register: install_result1
    - name: install teh 
      ansible.builtin.apt:
        name: "{{ pkg2 }}"
        state: latest
      when: ansible_distribution == "Ubuntu"
    - name: enable the apache service
      ansible.builtin.service:
        name: "{{ pkg1 }}"
        state: started
      when: ansible_distribution == "RedHat"
    - name: enable apache service on Ubuntu
      ansible.builtin.service:
        name: "{{ pkg2 }}"
        state: started
      when: ansible_distribution == "Ubuntu"